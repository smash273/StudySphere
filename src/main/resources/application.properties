# StudySphere Application Properties

# Database Settings
db.url=jdbc:postgresql://localhost:5432/studysphere
db.user=postgres
db.password=postgres
db.pool.size=10
db.pool.minIdle=2
db.driver=org.postgresql.Driver

# AI Settings
ai.provider=fallback
ai.api.key=
ai.model=gpt-4o-mini
ai.endpoint=https://api.openai.com/v1/chat/completions
ai.timeout.seconds=60

# Document Upload & Processing
upload.directory=./uploads
upload.max.size.mb=25
chunk.size.words=600
chunk.overlap.words=100

# Concurrency
concurrency.worker.threads=4

# Application
app.name=StudySphere
app.version=1.0.0
app.environment=production
